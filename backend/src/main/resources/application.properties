# Carga variables desde backend/.env si existe
spring.config.import=optional:file:.env[.properties]

server.port=8080

# Origen permitido para CORS (Angular)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# Nombre que verá el destinatario como remitente
app.mail.from-name=${MAIL_FROM_NAME:Sistema de Correos}

# Configuración de Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Envío por HTTPS mediante Google Apps Script (para hostings que bloquean SMTP).
# Si MAIL_RELAY_URL está vacío, se usa SMTP de Gmail.
app.mail.relay-url=${MAIL_RELAY_URL:}
app.mail.relay-secret=${MAIL_RELAY_SECRET:}
